[package]
name = "fsearch"
version = "0.8.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Fast Alfred-style file search for the terminal"
repository = "https://github.com/joshwhiteley/fsearch"
homepage = "https://github.com/joshwhiteley/fsearch"

[dependencies]
anyhow = "1"
# same crossterm ratatui uses; the use-dev-tty feature makes events read
# from /dev/tty so `cmd | fsearch --filter` gets a working interactive UI
crossterm = { version = "0.29", features = ["use-dev-tty", "events"] }
dirs = "6"
fastembed = { version = "5.17.4", optional = true, default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
half = "2"
ignore = "0.4"
# codecs match the extension list in src/images.rs; EXR/AVIF et al. are
# never previewed and cost real compile time (exr, ravif→rav1e)
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "qoi",
    "rayon",
    "tiff",
    "webp",
] }
memmap2 = "0.9"
notify = "8"
nucleo-matcher = "0.3"
pdf-extract = "0.12.0"
quick-xml = "0.41"
ratatui = "0.30"
# no image-defaults: it re-enables every image codec behind our back
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
rayon = "1"
regex = "1"
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
serde = { version = "1", features = ["derive"] }
syntect = "5"
terminal-colorsaurus = "1"
toml = "1"
two-face = "0.5"
zip = { version = "7", default-features = false, features = ["deflate"] }

[features]
# Sharper cell-art image previews for terminals without a graphics protocol.
# Needs libchafa >= 1.8 and pkg-config at build time, libchafa at run time
# (`brew install chafa pkgconf`):
#   cargo install --path . --features chafa
chafa = ["ratatui-image/chafa-dyn"]
# Semantic search (`? query`): local ONNX embeddings via fastembed.
# Heavy build (onnxruntime); the model (~90 MB) downloads on first index.
#   cargo install --path . --features semantic
semantic = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
