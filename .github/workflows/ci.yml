name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --features semantic

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Install PTY test runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: PTY smoke test
        run: |
          cargo build --locked --bin fsearch
          tests/smoke.exp target/debug/fsearch

  msrv:
    name: check (Rust 1.90.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.90.0
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --features semantic

  # semantic tests use the deterministic fake embedder (FSEARCH_SEM_FAKE=1,
  # see tests/cli_test.rs), so no model download happens in CI
  test-semantic:
    name: test (semantic)
    runs-on: ubuntu-latest
    env:
      FSEARCH_SEM_FAKE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features semantic

  test-all-features:
    name: test + clippy (all features)
    runs-on: macos-latest
    env:
      FSEARCH_SEM_FAKE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew install chafa pkgconf
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test-native-semantic:
    name: test (native ONNX runtime + model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FSEARCH_SEM_FAKE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # fastembed/ort request native API 24. Provision the CPU library explicitly
      # rather than depending on a runner-installed or fake runtime.
      - name: Install ONNX Runtime
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/fsearch-native-cache" >> "$GITHUB_ENV"
          python -m pip install onnxruntime==1.24.4
          python - <<'PY'
          import os
          from pathlib import Path
          import onnxruntime
          libraries = list((Path(onnxruntime.__file__).parent / "capi").glob("libonnxruntime.so.*"))
          assert len(libraries) == 1, libraries
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ORT_DYLIB_PATH={libraries[0]}\n")
          PY
      - name: Initialize native runtime without mutating the environment
        run: cargo test --locked --features semantic --lib sem::real::native_runtime_initializes_without_environment_mutation -- --ignored --exact
      - name: Embed text with the real model
        run: cargo test --locked --features semantic --test native_semantic -- --ignored

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --all-features check advisories sources
