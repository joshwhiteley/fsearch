name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Output of `fsearch --version` and `fsearch --doctor`, your terminal (and multiplexer, if any), and OS.
      placeholder: |
        fsearch 0.3.0
        terminal: Ghostty 1.2 (inside Herdr)
        macOS 26.5
    validations:
      required: true
